name: Detection Pipeline - Validate & Convert

on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  pull_request:
    branches: [main]
    paths:
      - 'rules/**'

jobs:
  validate-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Sigma rules
        run: |
          echo "=== Validating Sigma Rule Syntax ==="
          sigma check rules/
          echo "=== All rules passed validation ==="

      - name: Convert rules (SPL + KQL + CQL)
        run: |
          echo "=== Converting Sigma rules to SIEM queries ==="
          python scripts/convert.py

      - name: Test against golden logs
        run: |
          echo "=== Testing rules against golden attack logs ==="
          python scripts/test_rules.py

      - name: Generate MITRE coverage
        run: |
          echo "=== Generating MITRE ATT&CK coverage ==="
          python scripts/mitre_coverage.py

      - name: Upload converted rules
        uses: actions/upload-artifact@v4
        with:
          name: converted-rules
          path: outputs/

      - name: Upload MITRE coverage
        uses: actions/upload-artifact@v4
        with:
          name: mitre-coverage
          path: coverage/

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const ruleFiles = require('child_process')
              .execSync('find rules/ -name "*.yml" | wc -l')
              .toString().trim();
            const splunkFiles = require('child_process')
              .execSync('find outputs/splunk/ -name "*.spl" 2>/dev/null | wc -l')
              .toString().trim();
            const sentinelFiles = require('child_process')
              .execSync('find outputs/sentinel/ -name "*.kql" 2>/dev/null | wc -l')
              .toString().trim();
            const csFiles = require('child_process')
              .execSync('find outputs/crowdstrike/ -name "*.cql" 2>/dev/null | wc -l')
              .toString().trim();
            const body = `## Detection Pipeline Results\n| Metric | Count |\n|--------|-------|\n| Sigma rules | ${ruleFiles} |\n| SPL (Splunk) | ${splunkFiles} |\n| KQL (Sentinel) | ${sentinelFiles} |\n| CQL (LogScale) | ${csFiles} |\n\nAll rules validated and converted successfully.\nMITRE coverage report available in workflow artifacts.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });