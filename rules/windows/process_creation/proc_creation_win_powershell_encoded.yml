title: Encoded PowerShell Command Execution
id: c8d4e9f2-a3b5-4c67-8d9e-0f1a2b3c4d5e
status: test
description: |
    Detects PowerShell execution with encoded commands (-EncodedCommand,
    -enc, -e). Attackers encode commands to evade simple string-matching
    detection. Legitimate use of encoding is extremely rare.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
author: YourName
date: 2026/09/25
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '
            - '-e '
            - '-ec '
    filter_short:
        CommandLine|re: '.*-e(nc?)?\s+[A-Za-z0-9+/]{0,20}=*\s*$'
    condition: selection and not filter_short
falsepositives:
    - Some enterprise management tools use encoded commands
    - SCCM task sequences occasionally use encoding
level: high