title: PowerShell Download Cradle Detected
id: 3b6ab547-8ec2-4991-b7e9-2d07c64f5e22
status: test
description: |
    Detects PowerShell commands that download content from the internet.
    Attackers use PowerShell download cradles as the first step in most
    attacks — downloading malware, tools, or second-stage payloads.
    This is one of the most common initial access techniques.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1105/
author: ajithkumar
date: 2026/09/25
tags:
    - attack.execution
    - attack.t1059.001
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cmd:
        CommandLine|contains:
            - 'Invoke-WebRequest'
            - 'IWR '
            - 'Invoke-RestMethod'
            - 'IRM '
            - 'DownloadFile'
            - 'DownloadString'
            - 'Net.WebClient'
            - 'Start-BitsTransfer'
            - 'wget '
            - 'curl '
    condition: selection_img and selection_cmd
falsepositives:
    - Legitimate PowerShell scripts used by IT for software deployment
    - SCCM or Intune scripts that download packages
level: medium