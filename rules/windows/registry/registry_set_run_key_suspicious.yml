title: Suspicious Registry Run Key Persistence
id: b7c3d8e1-f2a4-4b56-9c7d-8e0f1a2b3c4d
status: test
description: |
    Detects additions to Registry Run keys that point to executables
    in suspicious locations. Registry Run keys auto-execute programs
    at login — attackers use them to maintain persistence.
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: YourName
date: 2026/09/25
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce\'
    suspicious_value:
        Details|contains:
            - '\Temp\'
            - '\AppData\Local\Temp\'
            - '\Downloads\'
            - '\Users\Public\'
            - '.bat'
            - '.cmd'
            - '.vbs'
            - '.ps1'
            - '.hta'
    condition: selection and suspicious_value
falsepositives:
    - Legitimate software that registers startup entries
    - VPN clients, chat applications
level: high